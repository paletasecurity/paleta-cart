# phenix image config for fielddev.qc2: Ubuntu 24.04 (noble) with OT-sim
# (https://github.com/patsec/ot-sim) built from source, plus mbpoll.
#
#   phenix config create images/fielddev.yml
#   phenix image build fielddev --output /phenix/images
#   phenix image inject-miniexe /opt/minimega/bin/miniccc /phenix/images/fielddev.qc2
#
# The last step adds minimega's miniccc agent, which phenix needs to run
# commands in the VMs; a fresh build doesn't include it.
apiVersion: phenix.sandia.gov/v1
kind: Image
metadata:
  name: fielddev
spec:
  components:
  - main
  - restricted
  - universe
  - multiverse
  compress: true
  format: qcow2
  kernel: null
  mirror: http://us.archive.ubuntu.com/ubuntu
  name: fielddev
  no_virtuals: false
  overlays: null
  packages:
  - build-essential
  - cmake
  - libboost-dev
  - libczmq-dev
  - libxml2-dev
  - libzmq3-dev
  - pkg-config
  - python3-dev
  - python3-pip
  - git
  - golang-go
  - ca-certificates
  - mbpoll
  - curl
  - ethtool
  - ncat
  - net-tools
  - openssh-server
  - rsync
  - ssh
  - tcpdump
  - tmux
  - vim
  - wget
  - linux-image-generic
  - linux-headers-generic
  ramdisk: false
  release: noble
  script_order:
  - POSTBUILD_APT_CLEANUP
  - POSTBUILD_NO_ROOT_PASSWD
  - POSTBUILD_PHENIX_HOSTNAME
  - POSTBUILD_PHENIX_BASE
  - INSTALL_OT_SIM
  scripts:
    POSTBUILD_APT_CLEANUP: '

      # --------------------------------------------------- Cleanup ----------------------------------------------------

      apt clean || apt-get clean || echo "unable to clean apt cache"

      '
    POSTBUILD_NO_ROOT_PASSWD: '

      # ---------------------------------------------- No Root Password ------------------------------------------------

      sed -i ''s/nullok_secure/nullok/'' /etc/pam.d/common-auth

      sed -i ''s/#PermitRootLogin prohibit-password/PermitRootLogin yes/'' /etc/ssh/sshd_config

      sed -i ''s/#PermitEmptyPasswords no/PermitEmptyPasswords yes/'' /etc/ssh/sshd_config

      sed -i ''s/PermitRootLogin prohibit-password/PermitRootLogin yes/'' /etc/ssh/sshd_config

      sed -i ''s/PermitEmptyPasswords no/PermitEmptyPasswords yes/'' /etc/ssh/sshd_config

      passwd -d root

      '
    POSTBUILD_PHENIX_BASE: "\n# ----------------------------------------------------- Base -----------------------------------------------------\ncat > /etc/systemd/system/miniccc.service <<EOF\n[Unit]\n\
      Description=miniccc\n[Service]\nUser=root\nEnvironment=HOME=/root\nExecStart=/opt/minimega/bin/miniccc -v=false -serial /dev/virtio-ports/cc -logfile /var/log/miniccc.log\n[Install]\nWantedBy=multi-user.target\n\
      EOF\ncat > /etc/systemd/system/phenix.service <<EOF\n[Unit]\nDescription=phenix startup service\nAfter=network.target systemd-hostnamed.service\n[Service]\nEnvironment=LD_LIBRARY_PATH=/usr/local/lib\n\
      ExecStart=/usr/local/bin/phenix-start.sh\nRemainAfterExit=true\nStandardOutput=journal\nType=oneshot\n[Install]\nWantedBy=multi-user.target\nEOF\nmkdir -p /etc/systemd/system/multi-user.target.wants\n\
      ln -s /etc/systemd/system/miniccc.service /etc/systemd/system/multi-user.target.wants/miniccc.service\nln -s /etc/systemd/system/phenix.service /etc/systemd/system/multi-user.target.wants/phenix.service\n\
      mkdir -p /usr/local/bin\ncat > /usr/local/bin/phenix-start.sh <<EOF\n#!/bin/bash\nfor file in /etc/phenix/startup/*; do\n\techo \\$file\n\tbash \\$file\ndone\nEOF\nchmod +x /usr/local/bin/phenix-start.sh\n\
      mkdir -p /etc/phenix/startup\n"
    POSTBUILD_PHENIX_HOSTNAME: "\n# -------------------------------------------------- Hostname ----------------------------------------------------\necho \"phenix\" > /etc/hostname\nsed -i 's/127.0.1.1\
      \ .*/127.0.1.1 phenix/' /etc/hosts\ncat > /etc/motd <<EOF\n\n\u2588\u2588\u2588\u2588\u2588\u2588\u2557 \u2588\u2588\u2557  \u2588\u2588\u2557\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2557\u2588\
      \u2588\u2588\u2557  \u2588\u2588\u2557\u2588\u2588\u2557\u2588\u2588\u2557  \u2588\u2588\u2557\n\u2588\u2588\u2554\u2550\u2550\u2588\u2588\u2557\u2588\u2588\u2551  \u2588\u2588\u2551\u2588\u2588\u2554\
      \u2550\u2550\u2550\u2550\u255D\u2588\u2588\u2588\u2588\u2557 \u2588\u2588\u2551\u2588\u2588\u2551\u255A\u2588\u2588\u2557\u2588\u2588\u2554\u255D\n\u2588\u2588\u2588\u2588\u2588\u2588\u2554\u255D\u2588\
      \u2588\u2588\u2588\u2588\u2588\u2588\u2551\u2588\u2588\u2588\u2588\u2588\u2557  \u2588\u2588\u2554\u2588\u2588\u2557\u2588\u2588\u2551\u2588\u2588\u2551 \u255A\u2588\u2588\u2588\u2554\u255D\n\u2588\
      \u2588\u2554\u2550\u2550\u2550\u255D \u2588\u2588\u2554\u2550\u2550\u2588\u2588\u2551\u2588\u2588\u2554\u2550\u2550\u255D  \u2588\u2588\u2551\u255A\u2588\u2588\u2588\u2588\u2551\u2588\u2588\u2551\
      \ \u2588\u2588\u2554\u2588\u2588\u2557\n\u2588\u2588\u2551     \u2588\u2588\u2551  \u2588\u2588\u2551\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2557\u2588\u2588\u2551 \u255A\u2588\u2588\u2588\u2551\
      \u2588\u2588\u2551\u2588\u2588\u2554\u255D\u255A\u2588\u2588\u2557\n\u255A\u2550\u255D     \u255A\u2550\u255D  \u255A\u2550\u255D\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u255D\u255A\u2550\u255D\
      \  \u255A\u2550\u2550\u255D\u255A\u2550\u255D\u255A\u2550\u255D  \u255A\u2550\u255D\n\nEOF\necho \"\\nBuilt with phenix image on $(date)\\n\\n\" >> /etc/motd\n"
    INSTALL_OT_SIM: '

      # ------------------------------------- OT-sim (patsec/ot-sim), from source -------------------------------------

      # Runs inside the image (vmdb2 chroot) after packages are installed. Builds the

      # C++ modules (cmake), the Go modules (make -C src/go install) and the Python

      # modules, following OT-sim''s README. Node-RED is left out (optional).

      set -e

      export DEBIAN_FRONTEND=noninteractive HOME=/root GOPATH=/root/go GOTOOLCHAIN=auto

      mkdir -p /usr/local/src && cd /usr/local/src

      rm -rf ot-sim && git clone --depth 1 https://github.com/patsec/ot-sim.git

      cd ot-sim

      git log -1 --format=''ot-sim commit %h %cd'' > /etc/ot-sim-version

      cmake -S . -B build && cmake --build build -j"$(nproc)" --target install && ldconfig

      make -C src/go install

      python3 -m pip install --break-system-packages src/python

      rm -rf /usr/local/src/ot-sim/build /root/go/pkg/mod /root/.cache

      ls /usr/local/bin | grep -i ot-sim > /etc/ot-sim-binaries || true

      '
  size: 12G
  skip_default_packages: false
  variant: minbase
