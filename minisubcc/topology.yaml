apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: minisubcc 
spec:
  networks:
    - name: relaynet
      subnet: 10.10.10.0/24
    - name: utilwan
      subnet: 192.168.10.0/24
  nodes:
    - name: cc 
      type: VirtualMachine

      general:
        hostname: cc
        vm_type: kvm
      
      injections:
        - src: injects/cc/cc.xml
          dst: /etc/ot-sim/config.xml
          permissions: "0644"
        - src: injects/start-ot-sim.sh
          dst: /etc/phenix/startup/90-ot-sim.sh
          permissions: "0755"
        
      hardware:
        os_type: linux
        memory: 512
        vcpus: 1
        drives:
          - image: fielddev.qc2
            interface: virtio

      network:
        interfaces:
          - name: eth0
            type: ethernet
            proto: static
            address: 192.168.10.1
            mask: 24
            vlan: utilwan

    - name: rtu
      type: VirtualMachine

      general:
        hostname: rtu
        vm_type: kvm
      
      injections:
        - src: injects/rtu.xml
          dst: /etc/ot-sim/config.xml
          permissions: "0644"
        - src: injects/start-ot-sim.sh
          dst: /etc/phenix/startup/90-ot-sim.sh
          permissions: "0755"
        
      hardware:
        os_type: linux
        memory: 512
        vcpus: 1
        drives:
          - image: fielddev.qc2
            interface: virtio

      network:
        interfaces:
          - name: eth0
            type: ethernet
            proto: static
            address: 10.10.10.10
            mask: 24
            vlan: relaynet
          - name: eth1
            type: ethernet
            proto: static
            address: 192.168.10.2
            mask: 24
            vlan: utilwan
    - name: ied1
      type: VirtualMachine

      general:
        hostname: ied1
        vm_type: kvm
      
      injections:
        - src: injects/ied1.xml
          dst: /etc/ot-sim/config.xml
          permissions: "0644"
        - src: injects/start-ot-sim.sh
          dst: /etc/phenix/startup/90-ot-sim.sh
          permissions: "0755"
        
      hardware:
        os_type: linux
        memory: 512
        vcpus: 1
        drives:
          - image: fielddev.qc2
            interface: virtio

      network:
        interfaces:
          - name: eth0
            type: ethernet
            proto: static
            address: 10.10.10.11
            mask: 24
            vlan: relaynet

    - name: ied2
