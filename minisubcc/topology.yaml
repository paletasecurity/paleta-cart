          permissions: "0755"

      hardware:
        os_type: linux
        memory: 512
        vcpus: 1
        drives:
          - image: fielddev.qc2
            interface: virtio

      network:
        interfaces:
          - name: eth0
            type: ethernet
            proto: static
            address: 10.10.10.12
            mask: 24
            vlan: relaynet
    
